name: Release

on:
    push:
        tags:
            - "v*"
    # For backfilling a platform onto a tag that already released, e.g. after adding a
    # target to binaries.yml. crates.io is skipped and PyPI/GitHub release uploads are additive, so
    # this only fills in what `tag` is missing.
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to backfill (e.g. v0.9.0)
                required: true

# The default for every job. `publish` and `publish-pypi` below each override this with their
# own `id-token: write` for trusted publishing, since a job's `permissions:` replaces this
# rather than adding to it
permissions:
    contents: write

jobs:
    build:
        name: Build
        permissions:
            contents: write
        uses: ./.github/workflows/binaries.yml
        with:
            tag: ${{ inputs.tag || github.ref_name }}

    # The binaries take their name from the tag and their version from Cargo.toml, so a
    # mistyped tag would otherwise ship one labelled as the other. This mattered more with
    # wheels attached, where a published version can never be reused, so keep it in mind when
    # those come back.
    version:
        name: Tag matches Cargo.toml
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Compare
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
                  tag=${RELEASE_TAG#v}
                  echo "Cargo.toml says $crate, tag says $tag"
                  if [ "$crate" != "$tag" ]; then
                    echo "::error::tag $RELEASE_TAG does not match Cargo.toml version $crate"
                    exit 1
                  fi

    # Gated on `build` as well as `version`: a tag that cannot build for every platform above
    # should not reach the registry, where a publish can never be undone, only yanked
    publish:
        name: Publish to crates.io
        needs: [build, version]
        # crates.io has no per-platform artifacts to backfill, and a version once published
        # can't be published again, so a manual dispatch skips this rather than fail it
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        environment: crates-io
        permissions:
            # Trusted publishing: crates.io verifies this workflow by OIDC, so there is no
            # long-lived token in the repository. Register the publisher once at
            # crates.io/crates/nkscan/settings with owner, repo and this workflow's filename.
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install the toolchain rust-toolchain.toml names
              run: cargo --version

            - name: Get a short-lived crates.io token
              id: auth
              uses: rust-lang/crates-io-auth-action@v1

            - name: Publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
              run: cargo publish

    # One abi3 wheel per platform: the floor Cargo.toml pins covers every
    # interpreter after it, so there is no per-Python-version matrix here.
    # Linux targets glibc rather than `build`'s musl, since manylinux is what
    # a wheel needs to be installable, not what makes a binary need no libc at all
    wheels:
        name: Wheel for ${{ matrix.target }}
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      manylinux: auto
                    - runner: windows-latest
                      target: x86_64-pc-windows-msvc
                    - runner: macos-14
                      target: aarch64-apple-darwin
                    - runner: macos-14
                      target: x86_64-apple-darwin
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build wheel
              uses: PyO3/maturin-action@v1
              with:
                  target: ${{ matrix.target }}
                  args: --release --out dist
                  manylinux: ${{ matrix.manylinux || 'auto' }}

            - name: Upload wheel
              uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ matrix.target }}
                  path: dist

    sdist:
        name: Source distribution
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  args: --out dist

            - name: Upload sdist
              uses: actions/upload-artifact@v4
              with:
                  name: wheel-sdist
                  path: dist

    publish-pypi:
        name: Publish to PyPI
        needs: [version, wheels, sdist]
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            # Trusted publishing: PyPI verifies this workflow by OIDC, so there is no long-lived
            # token in the repository. Register the publisher once at
            # pypi.org/manage/account/publishing with owner, repo and this workflow's filename.
            id-token: write
        steps:
            - name: Collect every wheel and the sdist
              uses: actions/download-artifact@v4
              with:
                  pattern: wheel-*
                  path: dist
                  merge-multiple: true

            - name: Publish
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist
                  # A backfill reuploads every wheel, not just the new platform's; skip
                  # rather than fail on the filenames already on PyPI from the original run
                  skip-existing: true

    attach-wheels:
        name: Attach wheels to the release
        needs: [version, wheels, sdist]
        runs-on: ubuntu-latest
        steps:
            - name: Collect every wheel and the sdist
              uses: actions/download-artifact@v4
              with:
                  pattern: wheel-*
                  path: dist
                  merge-multiple: true

            - name: Upload to release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag || github.ref_name }}
                  files: dist/*
