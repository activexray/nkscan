name: Release

on:
    push:
        tags:
            - "v*"

# The default for every job. `publish` and `publish-pypi` below each override this with their
# own `id-token: write` for trusted publishing, since a job's `permissions:` replaces this
# rather than adding to it
permissions:
    contents: write

jobs:
    # One job for every artifact, built with cargo on the runner for that platform. The flake
    # stays a flake: it is the dev shell and `nix flake check`, and nothing a release depends
    # on. It used to build the Linux binary, which baked its ELF interpreter to a /nix/store
    # glibc and so ran on no machine but a Nix one.
    #
    # Static where a platform allows it. musl links the whole libc in, so the Linux binary has
    # no glibc floor and no loader to find; +crt-static folds in the MSVC runtime, so Windows
    # needs no VC++ redistributable. macOS cannot: Apple does not support statically linking
    # libSystem, and does not have to, since it lives at an absolute path every Mac has.
    build:
        name: ${{ matrix.target }}
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      target: x86_64-unknown-linux-musl
                    - runner: windows-latest
                      target: x86_64-pc-windows-msvc
                      rustflags: -C target-feature=+crt-static
                      ext: .exe
                    - runner: macos-14
                      target: aarch64-apple-darwin
                    # Cross-compiled from the arm64 runner above: no free Intel runner exists
                    - runner: macos-14
                      target: x86_64-apple-darwin
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # rust-toolchain.toml names the channel and the targets, and rustup honours both
            # when cargo first runs, so there is no version here to drift from that file
            - name: Install the toolchain rust-toolchain.toml names
              run: cargo --version

            - name: Cache Rust artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Build
              shell: bash
              env:
                  RUSTFLAGS: ${{ matrix.rustflags }}
              run: |
                  cargo build --release -p nkscan --features=cli --target ${{ matrix.target }}
                  cp target/${{ matrix.target }}/release/nkscan${{ matrix.ext }} \
                     nkscan-${{ matrix.target }}${{ matrix.ext }}

            # The Nix-built binary this replaces looked fine on the runner that made it and
            # failed with "No such file or directory" everywhere else. Assert what a release
            # actually needs from a user's machine rather than find out from a bug report
            - name: Check it will run off this machine
              shell: bash
              run: |
                  bin=nkscan-${{ matrix.target }}${{ matrix.ext }}
                  case "$RUNNER_OS" in
                    Linux)
                      file "$bin"
                      file "$bin" | grep -q static \
                        || { echo "::error::$bin is not statically linked"; exit 1; }
                      ;;
                    macOS)
                      otool -L "$bin"
                      bad=$(otool -L "$bin" | tail -n +2 | sed 's/^[[:space:]]*//' \
                            | grep -vE '^(/usr/lib/|/System/Library/)' || true)
                      [ -z "$bad" ] \
                        || { echo "::error::$bin links dylibs a Mac may not have: $bad"; exit 1; }
                      ;;
                    Windows)
                      # Both are how a dynamically linked CRT shows up, and either means the
                      # user needs the VC++ redistributable installed
                      grep -qaE 'VCRUNTIME|api-ms-win-crt' "$bin" \
                        && { echo "::error::$bin still imports the VC++ runtime"; exit 1; }
                      echo "no VC++ runtime imports"
                      ;;
                  esac

            - name: Upload to release
              uses: softprops/action-gh-release@v2
              with:
                  files: nkscan-${{ matrix.target }}${{ matrix.ext }}

    # The binaries take their name from the tag and their version from Cargo.toml, so a
    # mistyped tag would otherwise ship one labelled as the other. This mattered more with
    # wheels attached, where a published version can never be reused, so keep it in mind when
    # those come back.
    version:
        name: Tag matches Cargo.toml
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Compare
              run: |
                  crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
                  tag=${GITHUB_REF_NAME#v}
                  echo "Cargo.toml says $crate, tag says $tag"
                  if [ "$crate" != "$tag" ]; then
                    echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
                    exit 1
                  fi

    # Gated on `build` as well as `version`: a tag that cannot build for every platform above
    # should not reach the registry, where a publish can never be undone, only yanked
    publish:
        name: Publish to crates.io
        needs: [build, version]
        runs-on: ubuntu-latest
        environment: crates-io
        permissions:
            # Trusted publishing: crates.io verifies this workflow by OIDC, so there is no
            # long-lived token in the repository. Register the publisher once at
            # crates.io/crates/nkscan/settings with owner, repo and this workflow's filename.
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install the toolchain rust-toolchain.toml names
              run: cargo --version

            - name: Get a short-lived crates.io token
              id: auth
              uses: rust-lang/crates-io-auth-action@v1

            - name: Publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
              run: cargo publish

    # One abi3 wheel per platform: the floor Cargo.toml pins covers every
    # interpreter after it, so there is no per-Python-version matrix here.
    # Linux targets glibc rather than `build`'s musl, since manylinux is what
    # a wheel needs to be installable, not what makes a binary need no libc at all
    wheels:
        name: Wheel for ${{ matrix.target }}
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      manylinux: auto
                    - runner: windows-latest
                      target: x86_64-pc-windows-msvc
                    - runner: macos-14
                      target: aarch64-apple-darwin
                    - runner: macos-14
                      target: x86_64-apple-darwin
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build wheel
              uses: PyO3/maturin-action@v1
              with:
                  target: ${{ matrix.target }}
                  args: --release --out dist
                  manylinux: ${{ matrix.manylinux || 'auto' }}

            - name: Upload wheel
              uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ matrix.target }}
                  path: dist

    sdist:
        name: Source distribution
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  args: --out dist

            - name: Upload sdist
              uses: actions/upload-artifact@v4
              with:
                  name: wheel-sdist
                  path: dist

    publish-pypi:
        name: Publish to PyPI
        needs: [version, wheels, sdist]
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            # Trusted publishing: PyPI verifies this workflow by OIDC, so there is no long-lived
            # token in the repository. Register the publisher once at
            # pypi.org/manage/account/publishing with owner, repo and this workflow's filename.
            id-token: write
        steps:
            - name: Collect every wheel and the sdist
              uses: actions/download-artifact@v4
              with:
                  pattern: wheel-*
                  path: dist
                  merge-multiple: true

            - name: Publish
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist

    attach-wheels:
        name: Attach wheels to the release
        needs: [version, wheels, sdist]
        runs-on: ubuntu-latest
        steps:
            - name: Collect every wheel and the sdist
              uses: actions/download-artifact@v4
              with:
                  pattern: wheel-*
                  path: dist
                  merge-multiple: true

            - name: Upload to release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/*
