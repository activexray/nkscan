[package]
name = "nkscan"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A platform-agnostic, performant driver for Nikon film scanners"
repository = "https://github.com/activexray/nkscan"
readme = "README.md"
keywords = ["scanner", "film", "nikon", "coolscan", "scsi"]
categories = ["hardware-support", "multimedia::images"]
exclude = [
  ".envrc",
  ".github/",
  "docs/*",
  "flake.nix",
  "flake.lock",
  "nkscan.pyi",
  "pyproject.toml",
  "scripts/",
  "scsi_proxy/",
]

[dependencies]
thiserror = "2"
bitflags = "2"
nusb = "0.2"
tracing = "0.1"
wide = "1"
rayon = "1"

# Python library dependencies
pyo3 = { version = "0.29", optional = true, features = ["abi3-py313"] }
numpy = { version = "0.29", optional = true }
pyo3-stub-gen = { version = "0.23", optional = true, default-features = false, features = [
  "numpy",
  "infer_signature",
] }

# cli deps
anyhow = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
indicatif = { version = "0.18", optional = true }
tiff = { version = "0.11", optional = true }
moxcms = { version = "0.9", optional = true }
ctrlc = { version = "3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }


[features]
cli = [
  "dep:anyhow",
  "dep:tracing-subscriber",
  "dep:clap",
  "dep:indicatif",
  "dep:tiff",
  "dep:moxcms",
  "dep:ctrlc",
  "dep:serde",
  "dep:serde_json",
]
python = ["dep:pyo3", "dep:numpy", "dep:pyo3-stub-gen"]

[lib]
name = "nkscan"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"] # For python support

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["ioctl"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Console",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
io-kit-sys = "0.5"

[[bin]]
name = "nkscan"
path = "src/bin/nkscan/main.rs"
required-features = ["cli"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["python"]

[dev-dependencies]
divan = "0.1.21"
tiff = "0.11"

[[bench]]
name = "dust"
harness = false
